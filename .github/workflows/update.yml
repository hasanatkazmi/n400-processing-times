name: Refresh N-400 processing times

# Scrapes USCIS, rebuilds history/offices.json and commits both files when the
# numbers change. USCIS sits behind Cloudflare's Turnstile challenge, which
# blocks some GitHub runner IPs outright. Reloading on the same runner rarely
# helps, so when the scrape fails this job dispatches itself again (up to
# MAX_ATTEMPTS in total) and the retry lands on a fresh runner with a new IP.

on:
  schedule:
    # Fires landing 02:00-04:00 UTC (US evening) have cleared Cloudflare 4 of 5
    # times; fires landing 17:00-22:00 UTC failed 5 of 6. GitHub delays cron by
    # 1-10 h, so these aim for the window that has worked. Keep off :00 minutes.
    - cron: '23 1 * * *'    # ~01:23 UTC
    - cron: '23 4 * * *'    # ~04:23 UTC
    - cron: '23 7 * * *'    # ~07:23 UTC
  workflow_dispatch:        # manual "Run workflow" button; also used by the retry below
    inputs:
      attempt:
        description: 'Attempt number (set automatically by retries; leave at 1)'
        required: false
        default: '1'

permissions:
  contents: write
  actions: write   # needed to dispatch the retry run

env:
  ATTEMPT: ${{ inputs.attempt || '1' }}
  MAX_ATTEMPTS: '4'

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history/offices.json is built from every past data.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The runner image ships real Google Chrome. Cloudflare's Turnstile is
      # more likely to pass with it than with a plain Chromium build.
      - name: Check Chrome
        run: google-chrome --version

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Scrape USCIS
        id: scrape
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
          DISABLE_XVFB: 'true'
        run: |
          echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
          xvfb-run -a --server-args="-screen 0 1300x1000x24" node scraper/scrape.mjs

      - name: Build per-office history
        if: steps.scrape.outcome == 'success'
        run: node scraper/history.mjs

      - name: Commit if changed
        if: steps.scrape.outcome == 'success'
        run: |
          if git diff --quiet -- data.json history/offices.json; then
            echo "No change in data.json."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json history/offices.json
            git commit -m "Update N-400 processing times ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Cloudflare (or an empty office list, which is the same block hitting the
      # site's API) is per-runner. Hand the job to a fresh runner instead of failing.
      - name: Retry on a fresh runner
        if: steps.scrape.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            next=$((ATTEMPT + 1))
            gh workflow run update.yml --ref "${{ github.ref_name }}" -f attempt="$next"
            echo "::warning title=Scrape blocked on this runner::Dispatched attempt $next of $MAX_ATTEMPTS on a fresh runner."
            echo "Scrape failed on attempt $ATTEMPT; dispatched attempt $next of $MAX_ATTEMPTS." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Scrape failed::All $MAX_ATTEMPTS attempts were blocked. The next scheduled fire will try again."
            exit 1
          fi
